<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-master {
        transform-origin: 7.5px 15px;
        animation: body-think 12s infinite ease-in-out;
      }
      .breathe { transform-origin: 7.5px 13px; animation: breathe 3.2s infinite ease-in-out; }
      .arm-r-think { transform-origin: 4px 5px; animation: arm-think 12s infinite ease-in-out; }
      .eyes-think { transform-origin: 7.5px 8px; animation: eyes-look 12s infinite ease-in-out; }
      .crystal-think { animation: think-glow 4s infinite ease-in-out; }
      .bubble-main { animation: morph-main 6s infinite ease-in-out; }
      .bubble-h { animation: morph-h 5s infinite ease-in-out; }
      .bubble-v { animation: morph-v 4s infinite ease-in-out; }
      .dot { opacity: 0; }
      .d1 { animation: load-1 2s infinite; }
      .d2 { animation: load-2 2s infinite; }
      .d3 { animation: load-3 2s infinite; }

      @keyframes body-think {
        0%, 35%, 80%, 100% { transform: rotate(0deg); }
        50%                { transform: rotate(1.5deg) translate(0.3px, 0); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50%      { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }
      @keyframes arm-think {
        0%, 38%, 75%, 100% { transform: rotate(0deg); }
        52%                { transform: rotate(-12deg) translate(0, -1px); }
        62%                { transform: rotate(-4deg); }
      }
      @keyframes eyes-look {
        0%, 14%, 100% { transform: translate(-0.5px, -0.3px) scaleY(1); }
        16%           { transform: translate(-0.5px, -0.3px) scaleY(0.1); }
        18%, 42%      { transform: translate(-0.5px, -0.3px) scaleY(1); }
        44%           { transform: translate(-0.5px, -0.3px) scaleY(0.1); }
        46%, 56%      { transform: translate(-0.5px, -0.3px) scaleY(1); }
        70%           { transform: translate(0.5px, 0) scaleY(1); }
        74%           { transform: translate(0.5px, 0) scaleY(1); }
        76%           { transform: translate(0.5px, 0) scaleY(0.1); }
        78%           { transform: translate(0.5px, 0) scaleY(1); }
        88%           { transform: translate(-0.5px, -0.3px) scaleY(1); }
      }
      @keyframes think-glow {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
      }
      @keyframes morph-main { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -0.3px); } }
      @keyframes morph-h    { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0.3px, 0); } }
      @keyframes morph-v    { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, 0.3px); } }
      @keyframes load-1     { 0%, 20% { opacity: 0; } 21%, 100% { opacity: 1; } }
      @keyframes load-2     { 0%, 40% { opacity: 0; } 41%, 100% { opacity: 1; } }
      @keyframes load-3     { 0%, 60% { opacity: 0; } 61%, 100% { opacity: 1; } }
    </style>
  </defs>

  <!-- Thinking bubble (upper-right) -->
  <g transform="translate(8, -7)">
    <g fill="#FFFFFF" opacity="0.9">
      <rect class="bubble-main" x="2" y="1" width="8" height="7"/>
      <rect class="bubble-h"    x="1" y="2" width="10" height="5"/>
      <rect class="bubble-v"    x="3" y="0" width="6" height="9"/>
      <rect x="2" y="7" width="2" height="2"/>
      <rect x="1" y="9" width="1" height="1"/>
    </g>
    <g fill="#5DBF7E">
      <rect class="dot d1" x="2.5" y="4" width="1" height="1"/>
      <rect class="dot d2" x="5.5" y="4" width="1" height="1"/>
      <rect class="dot d3" x="8.5" y="4" width="1" height="1"/>
    </g>
  </g>

  <rect x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <g class="body-master">
    <g class="breathe">
      <g fill="#A47148">
        <rect x="2"  y="11" width="2" height="3"/>
        <rect x="5"  y="12" width="1" height="2"/>
        <rect x="9"  y="12" width="1" height="2"/>
        <rect x="11" y="11" width="2" height="3"/>
      </g>

      <!-- Raised arm "thinking gesture" -->
      <g class="arm-r-think">
        <g fill="#A47148">
          <rect x="2" y="3"  width="2" height="3"/>
          <rect x="3" y="1"  width="2" height="2"/>
          <rect x="3" y="-1" width="2" height="2"/>
        </g>
      </g>

      <rect x="13" y="7" width="2" height="2" fill="#A47148"/>
      <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

      <g fill="#6B4A2D">
        <rect x="2" y="8"  width="11" height="0.4"/>
        <rect x="6" y="5"  width="0.4" height="3"/>
        <rect x="9" y="8.4" width="0.4" height="3.6"/>
      </g>

      <g fill="#C49A6C">
        <rect x="3"  y="5" width="2" height="1"/>
        <rect x="8"  y="5" width="2" height="1"/>
      </g>

      <g class="crystal-think" fill="#5DBF7E">
        <rect x="4"  y="6"  width="1" height="1"/>
        <rect x="10" y="6"  width="1" height="1"/>
        <rect x="6"  y="10" width="2" height="1"/>
      </g>

      <g class="eyes-think" fill="#1A1A1A">
        <rect x="4"  y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
    </g>
  </g>

  <!-- ====== Xenonite glass dome (12-panel dodecahedron, face-on) ====== -->
  <g id="rocky-dome">
    <style>
      .dome-pulse   { animation: dome-pulse 3.5s infinite ease-in-out; }
      .dome-flash-a { animation: dome-flash 5s infinite ease-in-out; }
      .dome-flash-b { animation: dome-flash 5s infinite ease-in-out; animation-delay: 2.5s; }
      @keyframes dome-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }
      @keyframes dome-flash {
        0%, 100% { opacity: 0; }
        10%, 18% { opacity: 0.85; }
        28%      { opacity: 0; }
      }
    </style>
    <polygon points="10.9,-5.5 16.4,-1.5 18.5,5 16.4,11.5 10.9,15.5 4.1,15.5 -1.4,11.5 -3.5,5 -1.4,-1.5 4.1,-5.5"
             fill="#9FD8E8" fill-opacity="0.07"/>
    <g stroke="#7A95A8" stroke-width="0.3" stroke-opacity="0.65" fill="none">
      <line x1="7.5"  y1="0.5" x2="7.5"  y2="-5.5"/>
      <line x1="11.8" y1="3.6" x2="16.4" y2="-1.5"/>
      <line x1="10.1" y1="8.6" x2="16.4" y2="11.5"/>
      <line x1="4.9"  y1="8.6" x2="-1.4" y2="11.5"/>
      <line x1="3.2"  y1="3.6" x2="-1.4" y2="-1.5"/>
    </g>
    <polygon points="7.5,0.5 11.8,3.6 10.1,8.6 4.9,8.6 3.2,3.6"
             fill="none" stroke="#5A7080" stroke-width="0.35" stroke-opacity="0.75"/>
    <polygon points="10.9,-5.5 16.4,-1.5 18.5,5 16.4,11.5 10.9,15.5 4.1,15.5 -1.4,11.5 -3.5,5 -1.4,-1.5 4.1,-5.5"
             fill="none" stroke="#3A4A55" stroke-width="0.55" stroke-opacity="0.95"/>
    <g fill="#1A2530">
      <rect x="10.6" y="-5.8" width="0.6" height="0.6"/>
      <rect x="16.1" y="-1.8" width="0.6" height="0.6"/>
      <rect x="18.2" y="4.7"  width="0.6" height="0.6"/>
      <rect x="16.1" y="11.2" width="0.6" height="0.6"/>
      <rect x="10.6" y="15.2" width="0.6" height="0.6"/>
      <rect x="3.8"  y="15.2" width="0.6" height="0.6"/>
      <rect x="-1.7" y="11.2" width="0.6" height="0.6"/>
      <rect x="-3.8" y="4.7"  width="0.6" height="0.6"/>
      <rect x="-1.7" y="-1.8" width="0.6" height="0.6"/>
      <rect x="3.8"  y="-5.8" width="0.6" height="0.6"/>
    </g>
    <g fill="#1A2530">
      <rect x="7.25"  y="0.25" width="0.5" height="0.5"/>
      <rect x="11.55" y="3.35" width="0.5" height="0.5"/>
      <rect x="9.85"  y="8.35" width="0.5" height="0.5"/>
      <rect x="4.65"  y="8.35" width="0.5" height="0.5"/>
      <rect x="2.95"  y="3.35" width="0.5" height="0.5"/>
    </g>
    <polygon class="dome-pulse" points="4.1,-5.5 -3.5,5 -1.5,5 5,-4" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect class="dome-pulse" x="6.5" y="-6" width="2" height="0.5" fill="#FFFFFF" opacity="0.85"/>
    <rect class="dome-flash-a" x="1" y="-3" width="0.5" height="1.5" fill="#FFFFFF"/>
    <rect class="dome-flash-b" x="14" y="3" width="1.5" height="0.5" fill="#FFFFFF"/>
  </g>
</svg>
