<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .breathe-deep {
        transform-origin: 7.5px 15px;
        animation: breathe-deep 4.8s infinite ease-in-out;
      }
      .shadow-pulse {
        transform-origin: 7.5px 15.5px;
        animation: shadow-pulse 4.8s infinite ease-in-out;
      }
      .crystal-dim {
        animation: dim 3s infinite ease-in-out;
      }
      .z-particle { opacity: 0; }
      .z1 { animation: float-z 6s infinite ease-in-out; animation-delay: 0s; }
      .z2 { animation: float-z 6s infinite ease-in-out; animation-delay: 2s; }
      .z3 { animation: float-z 6s infinite ease-in-out; animation-delay: 4s; }

      @keyframes breathe-deep {
        0%, 80%, 100% { transform: scale(1, 1); }
        30%, 40%      { transform: scale(1.04, 1.18); }
      }
      @keyframes shadow-pulse {
        0%, 80%, 100% { transform: scaleX(1);   opacity: 0.4; }
        30%, 40%      { transform: scaleX(1.08); opacity: 0.5; }
      }
      @keyframes dim {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 0.3;  }
      }
      @keyframes float-z {
        0%   { transform: translate(2px, 6px)  scale(0.4); opacity: 0; }
        15%  { opacity: 0.9; }
        50%  { transform: translate(6px, 0px)  scale(0.8); }
        85%  { opacity: 0.6; }
        100% { transform: translate(4px, -8px) scale(1.1); opacity: 0; }
      }
    </style>

    <g id="pixel-z">
      <rect x="0" y="0" width="4" height="1"/>
      <rect x="2" y="1" width="1" height="1"/>
      <rect x="1" y="2" width="1" height="1"/>
      <rect x="0" y="3" width="4" height="1"/>
    </g>
  </defs>

  <rect class="shadow-pulse" x="-2" y="15" width="19" height="1" fill="#000000" opacity="0.5"/>

  <!-- Floating Zzz -->
  <g>
    <use href="#pixel-z" class="z-particle z1" x="6" y="-2" fill="#90A4AE"/>
    <use href="#pixel-z" class="z-particle z2" x="6" y="-2" fill="#B0BEC5"/>
    <use href="#pixel-z" class="z-particle z3" x="6" y="-2" fill="#CFD8DC"/>
  </g>

  <g class="breathe-deep">
    <!-- Drooped head (small bump above body, asleep posture) -->
    <g fill="#A47148">
      <rect x="4" y="8" width="6" height="2"/>
    </g>

    <!-- Main rocky body (crouched, sitting on tucked legs) -->
    <g fill="#A47148">
      <rect x="2" y="10" width="11" height="3"/>
      <rect x="3" y="13" width="9"  height="1"/>
    </g>

    <!-- Tucked feet (just visible at sides) -->
    <g fill="#A47148">
      <rect x="3"  y="14" width="2" height="0.6"/>
      <rect x="10" y="14" width="2" height="0.6"/>
    </g>

    <!-- Stone segmentation cracks -->
    <g fill="#6B4A2D">
      <rect x="2"   y="11.5" width="11"  height="0.4"/>
      <rect x="7"   y="8"    width="0.4" height="2"/>
      <rect x="6"   y="13"   width="3"   height="0.3"/>
      <rect x="9.5" y="10.5" width="0.4" height="2.5"/>
    </g>

    <!-- Highlights -->
    <g fill="#C49A6C">
      <rect x="4" y="8"  width="2" height="0.5"/>
      <rect x="2" y="10" width="3" height="0.5"/>
      <rect x="9" y="10" width="3" height="0.5"/>
    </g>

    <!-- Dim crystals (dimly glowing while asleep) -->
    <g class="crystal-dim" fill="#5DBF7E">
      <rect x="4" y="11" width="1" height="1"/>
      <rect x="10" y="11" width="1" height="1"/>
      <rect x="6"  y="13" width="2" height="0.5"/>
    </g>
  </g>

  <!-- ====== Xenonite glass dome (12-panel dodecahedron, face-on) ====== -->
  <g id="rocky-dome">
    <style>
      .dome-pulse   { animation: dome-pulse 3.5s infinite ease-in-out; }
      .dome-flash-a { animation: dome-flash 5s infinite ease-in-out; }
      .dome-flash-b { animation: dome-flash 5s infinite ease-in-out; animation-delay: 2.5s; }
      @keyframes dome-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }
      @keyframes dome-flash {
        0%, 100% { opacity: 0; }
        10%, 18% { opacity: 0.85; }
        28%      { opacity: 0; }
      }
    </style>
    <polygon points="10.9,-5.5 16.4,-1.5 18.5,5 16.4,11.5 10.9,15.5 4.1,15.5 -1.4,11.5 -3.5,5 -1.4,-1.5 4.1,-5.5"
             fill="#9FD8E8" fill-opacity="0.07"/>
    <g stroke="#7A95A8" stroke-width="0.3" stroke-opacity="0.65" fill="none">
      <line x1="7.5"  y1="0.5" x2="7.5"  y2="-5.5"/>
      <line x1="11.8" y1="3.6" x2="16.4" y2="-1.5"/>
      <line x1="10.1" y1="8.6" x2="16.4" y2="11.5"/>
      <line x1="4.9"  y1="8.6" x2="-1.4" y2="11.5"/>
      <line x1="3.2"  y1="3.6" x2="-1.4" y2="-1.5"/>
    </g>
    <polygon points="7.5,0.5 11.8,3.6 10.1,8.6 4.9,8.6 3.2,3.6"
             fill="none" stroke="#5A7080" stroke-width="0.35" stroke-opacity="0.75"/>
    <polygon points="10.9,-5.5 16.4,-1.5 18.5,5 16.4,11.5 10.9,15.5 4.1,15.5 -1.4,11.5 -3.5,5 -1.4,-1.5 4.1,-5.5"
             fill="none" stroke="#3A4A55" stroke-width="0.55" stroke-opacity="0.95"/>
    <g fill="#1A2530">
      <rect x="10.6" y="-5.8" width="0.6" height="0.6"/>
      <rect x="16.1" y="-1.8" width="0.6" height="0.6"/>
      <rect x="18.2" y="4.7"  width="0.6" height="0.6"/>
      <rect x="16.1" y="11.2" width="0.6" height="0.6"/>
      <rect x="10.6" y="15.2" width="0.6" height="0.6"/>
      <rect x="3.8"  y="15.2" width="0.6" height="0.6"/>
      <rect x="-1.7" y="11.2" width="0.6" height="0.6"/>
      <rect x="-3.8" y="4.7"  width="0.6" height="0.6"/>
      <rect x="-1.7" y="-1.8" width="0.6" height="0.6"/>
      <rect x="3.8"  y="-5.8" width="0.6" height="0.6"/>
    </g>
    <g fill="#1A2530">
      <rect x="7.25"  y="0.25" width="0.5" height="0.5"/>
      <rect x="11.55" y="3.35" width="0.5" height="0.5"/>
      <rect x="9.85"  y="8.35" width="0.5" height="0.5"/>
      <rect x="4.65"  y="8.35" width="0.5" height="0.5"/>
      <rect x="2.95"  y="3.35" width="0.5" height="0.5"/>
    </g>
    <polygon class="dome-pulse" points="4.1,-5.5 -3.5,5 -1.5,5 5,-4" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect class="dome-pulse" x="6.5" y="-6" width="2" height="0.5" fill="#FFFFFF" opacity="0.85"/>
    <rect class="dome-flash-a" x="1" y="-3" width="0.5" height="1.5" fill="#FFFFFF"/>
    <rect class="dome-flash-b" x="14" y="3" width="1.5" height="0.5" fill="#FFFFFF"/>
  </g>
</svg>
