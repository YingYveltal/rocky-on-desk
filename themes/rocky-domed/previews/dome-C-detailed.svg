<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <rect x="-15" y="-25" width="45" height="45" fill="#F8F4ED"/>
  <text x="7.5" y="-22" text-anchor="middle" font-family="monospace" font-size="2.6" font-weight="700" fill="#2C3640">C. 3D dodecahedron · with depth shading</text>
  <text x="7.5" y="-19" text-anchor="middle" font-family="monospace" font-size="1.8" fill="#5A6B7A">5 visible side panels · light/shadow · realistic</text>

  <rect x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <g fill="#A47148">
    <rect x="2"  y="11" width="2" height="4"/>
    <rect x="5"  y="12" width="1" height="3"/>
    <rect x="9"  y="12" width="1" height="3"/>
    <rect x="11" y="11" width="2" height="4"/>
  </g>
  <g fill="#6B4A2D">
    <rect x="2"  y="14" width="2" height="1"/>
    <rect x="11" y="14" width="2" height="1"/>
  </g>
  <g fill="#A47148">
    <rect x="2" y="3"  width="2" height="3"/>
    <rect x="3" y="1"  width="2" height="2"/>
    <rect x="3" y="-1" width="2" height="2"/>
  </g>
  <rect x="13" y="7" width="2" height="2" fill="#A47148"/>
  <rect x="2" y="5" width="11" height="7" fill="#A47148"/>
  <g fill="#6B4A2D">
    <rect x="2" y="8"  width="11" height="0.4"/>
    <rect x="6" y="5"  width="0.4" height="3"/>
    <rect x="9" y="8.4" width="0.4" height="3.6"/>
  </g>
  <g fill="#C49A6C">
    <rect x="3"  y="5" width="2" height="1"/>
    <rect x="8"  y="5" width="2" height="1"/>
    <rect x="11" y="5" width="1" height="1"/>
  </g>
  <g fill="#5DBF7E">
    <rect x="4"  y="6"  width="1" height="1"/>
    <rect x="10" y="6"  width="1" height="1"/>
    <rect x="6"  y="10" width="2" height="1"/>
    <rect x="3"  y="11" width="1" height="1"/>
  </g>
  <g fill="#2E7D5C">
    <rect x="4"  y="7"  width="1" height="0.4"/>
    <rect x="6"  y="11" width="2" height="0.4"/>
  </g>
  <g fill="#1A1A1A">
    <rect x="4"  y="8" width="1" height="2"/>
    <rect x="10" y="8" width="1" height="2"/>
  </g>

  <!-- ========================================================== -->
  <!-- DOME OPTION C: Decagon with shaded side faces (3D feel) -->
  <!-- ========================================================== -->
  <g id="dome">
    <!-- 5 side-face fills (each a quadrilateral, shaded by angle to suggest 3D) -->
    <!-- Top face (slightly bright) -->
    <polygon points="7.5,0.5 11.8,3.6 16.4,-1.5 4.1,-5.5 -1.4,-1.5 3.2,3.6"
             fill="#C8E8F2" fill-opacity="0.18"/>
    <!-- Wait — that's a hexagon. Let me redo with trapezoidal sub-faces. -->

    <!-- Re-fill: 5 trapezoidal side faces with different shading -->
    <!-- Upper face A (above pentagon top edge) — light -->
    <polygon points="7.5,0.5 11.8,3.6 10.9,-5.5 4.1,-5.5 3.2,3.6" fill="#D4ECF5" fill-opacity="0.22"/>
    <!-- Upper-right face — medium-light -->
    <polygon points="11.8,3.6 10.1,8.6 16.4,11.5 18.5,5 16.4,-1.5" fill="#A8D5E5" fill-opacity="0.22"/>
    <!-- Upper-left face — bright (light source upper-left) -->
    <polygon points="3.2,3.6 4.9,8.6 -1.4,11.5 -3.5,5 -1.4,-1.5" fill="#E5F4FA" fill-opacity="0.32"/>
    <!-- Lower-right face — darker (shadow side) -->
    <polygon points="10.1,8.6 4.9,8.6 4.1,15.5 10.9,15.5 16.4,11.5" fill="#7AAEC0" fill-opacity="0.22"/>
    <!-- (5 trapezoids approximate the visible side faces in face-on projection) -->

    <!-- Spoke lines (panel boundaries) -->
    <g stroke="#3A4A55" stroke-width="0.32" stroke-opacity="0.9" fill="none">
      <line x1="7.5"  y1="0.5" x2="7.5"  y2="-5.5"/>
      <line x1="11.8" y1="3.6" x2="16.4" y2="-1.5"/>
      <line x1="10.1" y1="8.6" x2="16.4" y2="11.5"/>
      <line x1="4.9"  y1="8.6" x2="-1.4" y2="11.5"/>
      <line x1="3.2"  y1="3.6" x2="-1.4" y2="-1.5"/>
    </g>

    <!-- Inner pentagon outline (heavier — this is the front face) -->
    <polygon points="7.5,0.5 11.8,3.6 10.1,8.6 4.9,8.6 3.2,3.6"
             fill="none" stroke="#2C3640" stroke-width="0.5" stroke-opacity="0.95"/>

    <!-- Outer decagon frame (very heavy metal) -->
    <polygon points="10.9,-5.5 16.4,-1.5 18.5,5 16.4,11.5 10.9,15.5 4.1,15.5 -1.4,11.5 -3.5,5 -1.4,-1.5 4.1,-5.5"
             fill="none" stroke="#1A2530" stroke-width="0.7" stroke-opacity="1"/>

    <!-- Frame highlight (light catches upper edges) -->
    <g stroke="#B8D5E0" stroke-width="0.25" stroke-opacity="0.8" fill="none">
      <polyline points="-3.5,5 -1.4,-1.5 4.1,-5.5"/>
      <polyline points="3.2,3.6 7.5,0.5 11.8,3.6"/>
    </g>

    <!-- Vertex rivets (dark, large) -->
    <g fill="#0A1018">
      <rect x="10.5" y="-5.9" width="0.8" height="0.8"/>
      <rect x="16.0" y="-1.9" width="0.8" height="0.8"/>
      <rect x="18.1" y="4.6"  width="0.8" height="0.8"/>
      <rect x="16.0" y="11.1" width="0.8" height="0.8"/>
      <rect x="10.5" y="15.1" width="0.8" height="0.8"/>
      <rect x="3.7"  y="15.1" width="0.8" height="0.8"/>
      <rect x="-1.8" y="11.1" width="0.8" height="0.8"/>
      <rect x="-3.9" y="4.6"  width="0.8" height="0.8"/>
      <rect x="-1.8" y="-1.9" width="0.8" height="0.8"/>
      <rect x="3.7"  y="-5.9" width="0.8" height="0.8"/>
    </g>
    <!-- Rivet highlights (tiny shine) -->
    <g fill="#5A7080">
      <rect x="10.6" y="-5.8" width="0.3" height="0.3"/>
      <rect x="16.1" y="-1.8" width="0.3" height="0.3"/>
      <rect x="18.2" y="4.7"  width="0.3" height="0.3"/>
    </g>

    <!-- Pentagon vertex bolts -->
    <g fill="#0A1018">
      <rect x="7.2"  y="0.2"  width="0.6" height="0.6"/>
      <rect x="11.5" y="3.3"  width="0.6" height="0.6"/>
      <rect x="9.8"  y="8.3"  width="0.6" height="0.6"/>
      <rect x="4.6"  y="8.3"  width="0.6" height="0.6"/>
      <rect x="2.9"  y="3.3"  width="0.6" height="0.6"/>
    </g>

    <!-- Glass shine on upper-left -->
    <polygon points="-3.5,5 -1.4,-1.5 4.1,-5.5 4.1,-3 -1.4,1 -3.5,7" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="6.5" y="-6.1" width="2.5" height="0.6" fill="#FFFFFF" opacity="0.95"/>

    <!-- Heavy metal base ring (3 layers for depth) -->
    <rect x="-4" y="15.6" width="23" height="0.5" fill="#8DA8B5" fill-opacity="0.95"/>
    <rect x="-4" y="16.0" width="23" height="0.4" fill="#3A4A55" fill-opacity="1"/>
    <rect x="-4" y="16.3" width="23" height="0.3" fill="#0A1018" fill-opacity="1"/>
  </g>
</svg>
