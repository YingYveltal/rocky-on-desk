<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <rect x="-15" y="-25" width="45" height="45" fill="#F8F4ED"/>
  <text x="7.5" y="-22" text-anchor="middle" font-family="monospace" font-size="2.6" font-weight="700" fill="#2C3640">B. Bell jar · curved glass dome</text>
  <text x="7.5" y="-19" text-anchor="middle" font-family="monospace" font-size="1.8" fill="#5A6B7A">faceted dome top · vertical struts · ornate base</text>

  <rect x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <g fill="#A47148">
    <rect x="2"  y="11" width="2" height="4"/>
    <rect x="5"  y="12" width="1" height="3"/>
    <rect x="9"  y="12" width="1" height="3"/>
    <rect x="11" y="11" width="2" height="4"/>
  </g>
  <g fill="#6B4A2D">
    <rect x="2"  y="14" width="2" height="1"/>
    <rect x="11" y="14" width="2" height="1"/>
  </g>
  <g fill="#A47148">
    <rect x="2" y="3"  width="2" height="3"/>
    <rect x="3" y="1"  width="2" height="2"/>
    <rect x="3" y="-1" width="2" height="2"/>
  </g>
  <rect x="13" y="7" width="2" height="2" fill="#A47148"/>
  <rect x="2" y="5" width="11" height="7" fill="#A47148"/>
  <g fill="#6B4A2D">
    <rect x="2" y="8"  width="11" height="0.4"/>
    <rect x="6" y="5"  width="0.4" height="3"/>
    <rect x="9" y="8.4" width="0.4" height="3.6"/>
  </g>
  <g fill="#C49A6C">
    <rect x="3"  y="5" width="2" height="1"/>
    <rect x="8"  y="5" width="2" height="1"/>
    <rect x="11" y="5" width="1" height="1"/>
  </g>
  <g fill="#5DBF7E">
    <rect x="4"  y="6"  width="1" height="1"/>
    <rect x="10" y="6"  width="1" height="1"/>
    <rect x="6"  y="10" width="2" height="1"/>
    <rect x="3"  y="11" width="1" height="1"/>
  </g>
  <g fill="#2E7D5C">
    <rect x="4"  y="7"  width="1" height="0.4"/>
    <rect x="6"  y="11" width="2" height="0.4"/>
  </g>
  <g fill="#1A1A1A">
    <rect x="4"  y="8" width="1" height="2"/>
    <rect x="10" y="8" width="1" height="2"/>
  </g>

  <!-- ========================================================== -->
  <!-- DOME OPTION B: Bell jar with faceted curved top -->
  <!-- ========================================================== -->
  <g id="dome">
    <!-- Glass tint (polygon approximating bell jar curve) -->
    <polygon points="-3,15 -3,5 -2,1 0,-2 3,-4.5 7.5,-5.5 12,-4.5 15,-2 17,1 18,5 18,15"
             fill="#9FD8E8" fill-opacity="0.07"/>

    <!-- Latitude lines (3 horizontal "rings" suggesting curvature) -->
    <g stroke="#7A95A8" stroke-width="0.22" stroke-opacity="0.5" fill="none">
      <polyline points="-3,5 -2,5 17,5 18,5"/>
      <polyline points="-1.5,1 0,1 15,1 16.5,1"/>
      <polyline points="1.5,-3 3,-3 12,-3 13.5,-3"/>
    </g>

    <!-- Vertical struts (from base to apex) -->
    <g stroke="#3A4A55" stroke-width="0.35" stroke-opacity="0.7" fill="none">
      <line x1="7.5" y1="-5.5" x2="7.5"  y2="15"/>
      <line x1="-2"  y1="1"    x2="-3"   y2="15"/>
      <line x1="17"  y1="1"    x2="18"   y2="15"/>
      <line x1="3"   y1="-4.5" x2="0"    y2="15"/>
      <line x1="12"  y1="-4.5" x2="15"   y2="15"/>
    </g>
    <!-- Diagonal struts converging at apex -->
    <g stroke="#3A4A55" stroke-width="0.3" stroke-opacity="0.55" fill="none">
      <line x1="-2"  y1="1"    x2="7.5" y2="-5.5"/>
      <line x1="17"  y1="1"    x2="7.5" y2="-5.5"/>
      <line x1="3"   y1="-4.5" x2="7.5" y2="-5.5"/>
      <line x1="12"  y1="-4.5" x2="7.5" y2="-5.5"/>
    </g>

    <!-- Outline (bell jar silhouette) -->
    <polyline points="-3,15 -3,5 -2,1 0,-2 3,-4.5 7.5,-5.5 12,-4.5 15,-2 17,1 18,5 18,15"
              fill="none" stroke="#3A4A55" stroke-width="0.55" stroke-opacity="0.95"/>

    <!-- Apex finial -->
    <rect x="6.8" y="-6.8" width="1.4" height="1.3" fill="#5A6B7A"/>
    <rect x="6.8" y="-6.8" width="1.4" height="0.4" fill="#8DA8B5"/>
    <rect x="7"   y="-7.4" width="1"   height="0.6" fill="#3A4A55"/>

    <!-- Highlight (left side of dome, simulating reflection) -->
    <polygon points="-2,1 0,-2 2,-1 -1,3" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="3.5" y="-5.2" width="2" height="0.4" fill="#FFFFFF" opacity="0.7"/>

    <!-- Heavy metal collar (where dome meets base) -->
    <rect x="-4" y="15"   width="23" height="0.6" fill="#7A8C9A" fill-opacity="0.9"/>
    <rect x="-4" y="15.5" width="23" height="0.5" fill="#3A4A55" fill-opacity="0.95"/>
    <rect x="-4" y="16"   width="23" height="0.4" fill="#1A2530" fill-opacity="0.9"/>

    <!-- Base rivets -->
    <g fill="#1A2530">
      <rect x="-2.5" y="15.1" width="0.5" height="0.4"/>
      <rect x="0.5"  y="15.1" width="0.5" height="0.4"/>
      <rect x="3.5"  y="15.1" width="0.5" height="0.4"/>
      <rect x="6.5"  y="15.1" width="0.5" height="0.4"/>
      <rect x="9.5"  y="15.1" width="0.5" height="0.4"/>
      <rect x="12.5" y="15.1" width="0.5" height="0.4"/>
      <rect x="15.5" y="15.1" width="0.5" height="0.4"/>
      <rect x="17.5" y="15.1" width="0.5" height="0.4"/>
    </g>
  </g>
</svg>
