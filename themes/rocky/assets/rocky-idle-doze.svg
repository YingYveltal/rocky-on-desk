<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .breathe-slow {
        transform-origin: 7.5px 13px;
        animation: breathe-slow 5.5s infinite ease-in-out;
      }
      .head-droop {
        transform-origin: 7.5px 5px;
        animation: droop 6s infinite ease-in-out;
      }
      .crystal-dim {
        animation: dim-glow 3.5s infinite ease-in-out;
      }
      #shadow-js { transform-origin: 7.5px 15px; }

      @keyframes breathe-slow {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50%      { transform: scale(1.02, 0.97) translate(0, 0.7px); }
      }
      @keyframes droop {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(2deg); }
      }
      @keyframes dim-glow {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 0.3; }
      }
    </style>
  </defs>

  <g id="shadow-js">
    <rect x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>
  </g>

  <g id="legs" fill="#A47148">
    <rect x="2"  y="11" width="2" height="4"/>
    <rect x="5"  y="12" width="1" height="3"/>
    <rect x="9"  y="12" width="1" height="3"/>
    <rect x="11" y="11" width="2" height="4"/>
  </g>

  <g id="body-js">
    <g class="breathe-slow">
      <g class="head-droop">
        <!-- Raised arm slightly lowered -->
        <g fill="#A47148">
          <rect x="2" y="4"  width="2" height="2"/>
          <rect x="3" y="2"  width="2" height="2"/>
          <rect x="3" y="0"  width="2" height="2"/>
        </g>

        <!-- Right arm drooped -->
        <rect x="13" y="8" width="2" height="2" fill="#A47148"/>

        <!-- Torso -->
        <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

        <!-- Cracks -->
        <g fill="#6B4A2D">
          <rect x="2" y="8"  width="11" height="0.4"/>
          <rect x="6" y="5"  width="0.4" height="3"/>
          <rect x="9" y="8.4" width="0.4" height="3.6"/>
        </g>

        <!-- Dim crystals -->
        <g class="crystal-dim" fill="#5DBF7E">
          <rect x="4"  y="6"  width="1" height="1"/>
          <rect x="10" y="6"  width="1" height="1"/>
          <rect x="6"  y="10" width="2" height="1"/>
        </g>

        <!-- Drowsy half-shut eyes -->
        <g id="eyes-doze" fill="#1A1A1A">
          <rect x="4"  y="9" width="1" height="0.7"/>
          <rect x="10" y="9" width="1" height="0.7"/>
        </g>
        <!-- Eye dark hollow remains (open part) -->
        <g fill="#3A2818">
          <rect x="4"  y="8.3" width="1" height="0.7"/>
          <rect x="10" y="8.3" width="1" height="0.7"/>
        </g>
      </g>
    </g>
  </g>

  <g id="eyes-js" fill="none">
    <rect x="4"  y="9" width="1" height="0.5"/>
    <rect x="10" y="9" width="1" height="0.5"/>
  </g>
</svg>
