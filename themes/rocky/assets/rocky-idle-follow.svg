<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .breathe-anim {
        transform-origin: 7.5px 13px;
        animation: breathe 3.6s infinite ease-in-out;
      }
      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: eye-blink 5s infinite ease-in-out;
      }
      .arm-sway {
        transform-origin: 4px 4px;
        animation: rock-sway 4.5s infinite ease-in-out;
      }
      .crystal-glow {
        animation: glow 2.8s infinite ease-in-out;
      }
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }
      #shadow-js { transform-origin: 7.5px 15px; }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50%      { transform: scale(1.015, 0.985) translate(0, 0.4px); }
      }
      @keyframes eye-blink {
        0%, 8%, 100% { transform: scaleY(1); }
        4%           { transform: scaleY(0.1); }
      }
      @keyframes rock-sway {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(-4deg); }
      }
      @keyframes glow {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
      }
    </style>
  </defs>

  <!-- Ground shadow (JS-controlled) -->
  <g id="shadow-js">
    <rect x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>
  </g>

  <!-- Static legs (don't sway with body) -->
  <g id="legs" fill="#A47148">
    <rect x="2"  y="11" width="2" height="4"/>
    <rect x="5"  y="12" width="1" height="3"/>
    <rect x="9"  y="12" width="1" height="3"/>
    <rect x="11" y="11" width="2" height="4"/>
  </g>
  <g fill="#6B4A2D">
    <rect x="2"  y="14" width="2" height="1"/>
    <rect x="11" y="14" width="2" height="1"/>
  </g>

  <!-- Upper body group (eye-tracking offset target) -->
  <g id="body-js">
    <g class="breathe-anim">
      <!-- Raised arm with rock-on fist (sways gently) -->
      <g class="arm-sway">
        <g fill="#A47148">
          <rect x="2" y="3"  width="2" height="3"/>
          <rect x="3" y="1"  width="2" height="2"/>
          <rect x="3" y="-1" width="2" height="2"/>
        </g>
        <rect x="3" y="-1" width="0.4" height="3" fill="#6B4A2D"/>
      </g>

      <!-- Right arm -->
      <g fill="#A47148">
        <rect x="13" y="7" width="2" height="2"/>
      </g>

      <!-- Main torso -->
      <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

      <!-- Stone cracks -->
      <g fill="#6B4A2D">
        <rect x="2" y="8"  width="11" height="0.4"/>
        <rect x="6" y="5"  width="0.4" height="3"/>
        <rect x="9" y="8.4" width="0.4" height="3.6"/>
      </g>

      <!-- Highlights -->
      <g fill="#C49A6C">
        <rect x="3"  y="5" width="2" height="1"/>
        <rect x="8"  y="5" width="2" height="1"/>
        <rect x="11" y="5" width="1" height="1"/>
      </g>

      <!-- Green crystals (subtle pulse) -->
      <g class="crystal-glow" fill="#5DBF7E">
        <rect x="4"  y="6"  width="1" height="1"/>
        <rect x="10" y="6"  width="1" height="1"/>
        <rect x="6"  y="10" width="2" height="1"/>
        <rect x="3"  y="11" width="1" height="1"/>
      </g>
      <g fill="#2E7D5C">
        <rect x="4"  y="7"  width="1" height="0.4"/>
        <rect x="6"  y="11" width="2" height="0.4"/>
      </g>

      <!-- Eyes (JS-tracked + blink) -->
      <g id="eyes-js" fill="#1A1A1A">
        <g class="eyes-blink">
          <rect x="4"  y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
