<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .collapse-body {
        transform-origin: 7.5px 15px;
        animation: collapse 2.5s 1 ease-in;
      }
      .collapse-shadow {
        transform-origin: 7.5px 15px;
        animation: shadow-spread 2.5s 1 ease-in;
      }
      .arm-fall {
        transform-origin: 4px 5px;
        animation: arm-drop 2.5s 1 ease-in;
      }

      @keyframes collapse {
        0%   { transform: translateY(0) scaleY(1); }
        45%  { transform: translateY(0.5px) scaleY(0.98); }
        80%  { transform: translateY(3px) scaleY(0.55) scaleX(1.15); }
        100% { transform: translateY(3px) scaleY(0.55) scaleX(1.15); }
      }
      @keyframes shadow-spread {
        0%   { transform: scaleX(1); opacity: 0.5; }
        80%, 100% { transform: scaleX(1.4); opacity: 0.6; }
      }
      @keyframes arm-drop {
        0%   { transform: rotate(0deg); }
        45%  { transform: rotate(-3deg); }
        80%, 100% { transform: rotate(70deg) translate(2px, 4px); }
      }
    </style>
  </defs>

  <rect class="collapse-shadow" x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <g class="collapse-body">
    <g fill="#A47148">
      <rect x="2"  y="11" width="2" height="4"/>
      <rect x="5"  y="12" width="1" height="3"/>
      <rect x="9"  y="12" width="1" height="3"/>
      <rect x="11" y="11" width="2" height="4"/>
    </g>

    <g class="arm-fall">
      <g fill="#A47148">
        <rect x="2" y="3"  width="2" height="3"/>
        <rect x="3" y="1"  width="2" height="2"/>
        <rect x="3" y="-1" width="2" height="2"/>
      </g>
    </g>

    <rect x="13" y="9" width="2" height="2" fill="#A47148"/>
    <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

    <g fill="#6B4A2D">
      <rect x="2" y="8"  width="11" height="0.4"/>
      <rect x="6" y="5"  width="0.4" height="3"/>
      <rect x="9" y="8.4" width="0.4" height="3.6"/>
    </g>

    <g fill="#5DBF7E" opacity="0.7">
      <rect x="4"  y="6"  width="1" height="1"/>
      <rect x="10" y="6"  width="1" height="1"/>
      <rect x="6"  y="10" width="2" height="1"/>
    </g>

    <!-- Closed/dropping eyes -->
    <g fill="#1A1A1A">
      <rect x="4"  y="9.2" width="1" height="0.5"/>
      <rect x="10" y="9.2" width="1" height="0.5"/>
    </g>
  </g>

  <!-- Small dust puff -->
  <g fill="#C49A6C" opacity="0.4">
    <rect x="0" y="14" width="1" height="1">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.2s" begin="2s" fill="freeze"/>
    </rect>
    <rect x="14" y="14" width="1" height="1">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.2s" begin="2s" fill="freeze"/>
    </rect>
  </g>
</svg>
