<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-jump {
        transform-origin: 7.5px 15px;
        animation: jump-cycle 1.2s infinite ease-in-out;
      }
      .shadow-flex {
        transform-origin: 7.5px 15.5px;
        animation: shadow-flex 1.2s infinite ease-in-out;
      }
      .rock1, .rock2, .rock3 {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .rock1 { animation: orbit-1 1.2s infinite ease-in-out; }
      .rock2 { animation: orbit-2 1.2s infinite ease-in-out; }
      .rock3 { animation: orbit-3 1.2s infinite ease-in-out; }

      @keyframes jump-cycle {
        0%, 100% { transform: translateY(0) scaleY(1); }
        20%      { transform: translateY(0) scaleY(0.92); }
        50%      { transform: translateY(-2px) scaleY(1.04); }
        80%      { transform: translateY(0) scaleY(0.92); }
      }
      @keyframes shadow-flex {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50%      { transform: scale(0.7); opacity: 0.3; }
      }
      @keyframes orbit-1 {
        0%   { transform: translate(-2px, -8px) rotate(0); }
        50%  { transform: translate(0, -12px) rotate(180deg); }
        100% { transform: translate(2px, -8px) rotate(360deg); }
      }
      @keyframes orbit-2 {
        0%   { transform: translate(2px, -8px) rotate(0); }
        50%  { transform: translate(0, -4px) rotate(-180deg); }
        100% { transform: translate(-2px, -8px) rotate(-360deg); }
      }
      @keyframes orbit-3 {
        0%   { transform: translate(0, -10px) rotate(0); }
        50%  { transform: translate(2px, -7px) rotate(180deg); }
        100% { transform: translate(0, -10px) rotate(360deg); }
      }
    </style>
  </defs>

  <rect class="shadow-flex" x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <!-- Floating rocks being juggled -->
  <g transform="translate(7.5, 0)">
    <g class="rock1">
      <rect x="-1" y="-1" width="2" height="2" fill="#A47148"/>
      <rect x="-0.5" y="-0.5" width="1" height="0.4" fill="#5DBF7E"/>
    </g>
    <g class="rock2">
      <rect x="-1" y="-1" width="2" height="2" fill="#A47148"/>
      <rect x="0" y="0" width="0.5" height="0.5" fill="#5DBF7E"/>
    </g>
    <g class="rock3">
      <rect x="-1" y="-1" width="2" height="2" fill="#A47148"/>
      <rect x="-0.5" y="0" width="1" height="0.4" fill="#C49A6C"/>
    </g>
  </g>

  <g class="body-jump">
    <g fill="#A47148">
      <rect x="2"  y="11" width="2" height="4"/>
      <rect x="5"  y="12" width="1" height="3"/>
      <rect x="9"  y="12" width="1" height="3"/>
      <rect x="11" y="11" width="2" height="4"/>
    </g>

    <!-- Both arms up juggling -->
    <g fill="#A47148">
      <rect x="2" y="3"  width="2" height="3"/>
      <rect x="2" y="1"  width="2" height="2"/>
      <rect x="11" y="3" width="2" height="3"/>
      <rect x="11" y="1" width="2" height="2"/>
    </g>

    <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

    <g fill="#6B4A2D">
      <rect x="2" y="8"  width="11" height="0.4"/>
      <rect x="6" y="5"  width="0.4" height="3"/>
      <rect x="9" y="8.4" width="0.4" height="3.6"/>
    </g>

    <g fill="#C49A6C">
      <rect x="3"  y="5" width="2" height="1"/>
      <rect x="8"  y="5" width="2" height="1"/>
    </g>

    <g fill="#5DBF7E">
      <rect x="4"  y="6"  width="1" height="1"/>
      <rect x="10" y="6"  width="1" height="1"/>
      <rect x="6"  y="10" width="2" height="1"/>
    </g>

    <!-- Focused eyes looking up -->
    <g fill="#1A1A1A">
      <rect x="4"  y="7.7" width="1" height="2"/>
      <rect x="10" y="7.7" width="1" height="2"/>
    </g>
  </g>
</svg>
