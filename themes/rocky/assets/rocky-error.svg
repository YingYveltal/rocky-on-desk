<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-shake {
        transform-origin: 7.5px 13px;
        animation: angry-shake 0.5s infinite ease-in-out;
      }
      .arm-fist {
        transform-origin: 4px 5px;
        animation: fist-shake 0.5s infinite ease-in-out;
      }
      .crystal-red {
        animation: red-flash 0.6s infinite ease-in-out;
      }
      .error-flash { animation: err-flash 0.8s infinite ease-in-out; }
      .crack-show { animation: crack-fade 1.5s infinite ease-in-out; }

      @keyframes angry-shake {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        25%      { transform: translateX(-0.5px) rotate(-2deg); }
        75%      { transform: translateX(0.5px)  rotate(2deg); }
      }
      @keyframes fist-shake {
        0%, 100% { transform: rotate(-3deg); }
        50%      { transform: rotate(-12deg) translateY(-1px); }
      }
      @keyframes red-flash {
        0%, 100% { fill: #FF5252; opacity: 1; }
        50%      { fill: #5DBF7E; opacity: 0.7; }
      }
      @keyframes err-flash {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.2; }
      }
      @keyframes crack-fade {
        0%, 100% { opacity: 0.4; }
        50%      { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <!-- Anger spark glyph (top right) -->
  <g class="error-flash" fill="#FF3B30">
    <rect x="11" y="-3" width="1" height="2"/>
    <rect x="13" y="-3" width="1" height="2"/>
    <rect x="12" y="-2" width="1" height="1"/>
    <rect x="10" y="-2" width="1" height="1"/>
    <rect x="14" y="-2" width="1" height="1"/>
  </g>

  <g class="body-shake">
    <g fill="#A47148">
      <rect x="2"  y="11" width="2" height="4"/>
      <rect x="5"  y="12" width="1" height="3"/>
      <rect x="9"  y="12" width="1" height="3"/>
      <rect x="11" y="11" width="2" height="4"/>
    </g>

    <!-- Angry raised fist -->
    <g class="arm-fist">
      <g fill="#A47148">
        <rect x="2" y="3"  width="2" height="3"/>
        <rect x="3" y="0"  width="3" height="3"/>
      </g>
      <rect x="3" y="0" width="0.4" height="3" fill="#6B4A2D"/>
    </g>

    <rect x="13" y="7" width="2" height="2" fill="#A47148"/>
    <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

    <!-- More cracks (angry/strained body) -->
    <g class="crack-show" fill="#6B4A2D">
      <rect x="2" y="8"  width="11" height="0.4"/>
      <rect x="6" y="5"  width="0.4" height="3"/>
      <rect x="9" y="8.4" width="0.4" height="3.6"/>
      <rect x="3" y="6"  width="0.4" height="2"/>
      <rect x="11" y="9" width="0.4" height="2"/>
    </g>

    <g fill="#C49A6C">
      <rect x="3"  y="5" width="2" height="1"/>
      <rect x="8"  y="5" width="2" height="1"/>
    </g>

    <g class="crystal-red">
      <rect x="4"  y="6"  width="1" height="1"/>
      <rect x="10" y="6"  width="1" height="1"/>
      <rect x="6"  y="10" width="2" height="1"/>
    </g>

    <!-- Angry V-shaped eyes -->
    <g fill="#1A1A1A">
      <rect x="3.7"  y="8" width="0.5" height="2" transform="rotate(20 3.95 9)"/>
      <rect x="4.6"  y="8.5" width="0.5" height="1.5" transform="rotate(20 4.85 9.25)"/>
      <rect x="9.7"  y="8" width="0.5" height="2" transform="rotate(-20 9.95 9)"/>
      <rect x="10.6" y="8.5" width="0.5" height="1.5" transform="rotate(-20 10.85 9.25)"/>
    </g>
  </g>

  <!-- ERROR text -->
  <g class="error-flash">
    <text x="7.5" y="-7" text-anchor="middle" font-family="'Courier New', monospace" font-size="3.5" font-weight="700" fill="#FF3B30">ERROR</text>
  </g>
</svg>
