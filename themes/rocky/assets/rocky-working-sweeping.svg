<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-sweep {
        transform-origin: 7.5px 15px;
        animation: sweep-bob 1.6s infinite ease-in-out;
      }
      .arm-sweep {
        transform-origin: 13px 7px;
        animation: sweep-arm 1.6s infinite ease-in-out;
      }
      .dust-anim { opacity: 0; }
      .du1 { animation: dust-fly 1.6s infinite; }
      .du2 { animation: dust-fly 1.6s infinite; animation-delay: 0.4s; }
      .du3 { animation: dust-fly 1.6s infinite; animation-delay: 0.8s; }

      @keyframes sweep-bob {
        0%, 100% { transform: translate(0, 0); }
        50%      { transform: translate(0.3px, 0); }
      }
      @keyframes sweep-arm {
        0%, 100% { transform: rotate(-15deg); }
        50%      { transform: rotate(35deg); }
      }
      @keyframes dust-fly {
        0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
        30%  { opacity: 0.7; }
        100% { opacity: 0; transform: translate(6px, -3px) scale(1.4); }
      }
    </style>
  </defs>

  <rect x="-3" y="15" width="21" height="1" fill="#000000" opacity="0.5"/>

  <!-- Dust clouds being swept -->
  <g fill="#C49A6C">
    <rect class="dust-anim du1" x="14" y="13" width="1" height="1"/>
    <rect class="dust-anim du2" x="15" y="12" width="1" height="1"/>
    <rect class="dust-anim du3" x="16" y="13" width="1" height="1"/>
  </g>

  <g class="body-sweep">
    <g fill="#A47148">
      <rect x="2"  y="11" width="2" height="4"/>
      <rect x="5"  y="12" width="1" height="3"/>
      <rect x="9"  y="12" width="1" height="3"/>
      <rect x="11" y="11" width="2" height="4"/>
    </g>

    <!-- Raised arm holding rock-on -->
    <g fill="#A47148">
      <rect x="2" y="3"  width="2" height="3"/>
      <rect x="3" y="1"  width="2" height="2"/>
      <rect x="3" y="-1" width="2" height="2"/>
    </g>

    <!-- Sweeping arm with broom -->
    <g class="arm-sweep">
      <rect x="13" y="6" width="2" height="2" fill="#A47148"/>
      <rect x="14" y="8" width="1" height="6" fill="#6B4A2D"/>
      <!-- Broom bristles -->
      <g fill="#C49A6C">
        <rect x="13"   y="13" width="0.8" height="1.5"/>
        <rect x="13.8" y="13" width="0.8" height="1.5"/>
        <rect x="14.6" y="13" width="0.8" height="1.5"/>
        <rect x="15.4" y="13" width="0.8" height="1.5"/>
      </g>
    </g>

    <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

    <g fill="#6B4A2D">
      <rect x="2" y="8"  width="11" height="0.4"/>
      <rect x="6" y="5"  width="0.4" height="3"/>
      <rect x="9" y="8.4" width="0.4" height="3.6"/>
    </g>

    <g fill="#C49A6C">
      <rect x="3"  y="5" width="2" height="1"/>
      <rect x="8"  y="5" width="2" height="1"/>
    </g>

    <g fill="#5DBF7E">
      <rect x="4"  y="6"  width="1" height="1"/>
      <rect x="10" y="6"  width="1" height="1"/>
      <rect x="6"  y="10" width="2" height="1"/>
    </g>

    <g fill="#1A1A1A">
      <rect x="4"  y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
  </g>
</svg>
