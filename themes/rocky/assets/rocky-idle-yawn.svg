<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-yawn {
        transform-origin: 7.5px 13px;
        animation: yawn-stretch 3s 1 ease-in-out;
      }
      .arm-stretch {
        transform-origin: 4px 5px;
        animation: arm-up 3s 1 ease-in-out;
      }
      .mouth-open {
        animation: mouth-yawn 3s 1 ease-in-out;
      }
      .crystal-pulse {
        animation: pulse 1.5s infinite ease-in-out;
      }

      @keyframes yawn-stretch {
        0%   { transform: scale(1, 1); }
        40%  { transform: scale(0.96, 1.06) translateY(-1px); }
        70%  { transform: scale(1.05, 0.96) translateY(0.5px); }
        100% { transform: scale(1, 1); }
      }
      @keyframes arm-up {
        0%   { transform: rotate(0deg); }
        40%  { transform: rotate(-15deg) translateY(-1px); }
        70%  { transform: rotate(8deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes mouth-yawn {
        0%, 100% { transform: scaleY(0); opacity: 0; }
        30%, 65% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.9; }
        50%      { opacity: 0.5; }
      }
    </style>
  </defs>

  <rect x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <g fill="#A47148">
    <rect x="2"  y="11" width="2" height="4"/>
    <rect x="5"  y="12" width="1" height="3"/>
    <rect x="9"  y="12" width="1" height="3"/>
    <rect x="11" y="11" width="2" height="4"/>
  </g>

  <g class="body-yawn">
    <g class="arm-stretch">
      <g fill="#A47148">
        <rect x="2" y="3"  width="2" height="3"/>
        <rect x="3" y="1"  width="2" height="2"/>
        <rect x="3" y="-1" width="2" height="2"/>
      </g>
    </g>

    <rect x="13" y="7" width="2" height="2" fill="#A47148"/>
    <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

    <g fill="#6B4A2D">
      <rect x="2" y="8"  width="11" height="0.4"/>
      <rect x="6" y="5"  width="0.4" height="3"/>
      <rect x="9" y="8.4" width="0.4" height="3.6"/>
    </g>

    <g fill="#C49A6C">
      <rect x="3"  y="5" width="2" height="1"/>
      <rect x="8"  y="5" width="2" height="1"/>
    </g>

    <g class="crystal-pulse" fill="#5DBF7E">
      <rect x="4"  y="6"  width="1" height="1"/>
      <rect x="10" y="6"  width="1" height="1"/>
      <rect x="6"  y="10" width="2" height="1"/>
    </g>

    <!-- Sleepy half-eyes -->
    <g fill="#1A1A1A">
      <rect x="4"  y="8.3" width="1" height="1.4"/>
      <rect x="10" y="8.3" width="1" height="1.4"/>
    </g>

    <!-- Yawning mouth (rocky cavernous opening) -->
    <g class="mouth-open" style="transform-origin: 7.5px 11.5px;">
      <rect x="6" y="10.5" width="3" height="2" fill="#1A1A1A"/>
      <rect x="6.5" y="10.5" width="2" height="0.4" fill="#3A2818"/>
    </g>
  </g>
</svg>
