<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .breathe-deep {
        transform-origin: 7.5px 15px;
        animation: breathe-deep 4.8s infinite ease-in-out;
      }
      .shadow-pulse {
        transform-origin: 7.5px 15.5px;
        animation: shadow-pulse 4.8s infinite ease-in-out;
      }
      .crystal-dim {
        animation: dim 3s infinite ease-in-out;
      }
      .z-particle { opacity: 0; }
      .z1 { animation: float-z 6s infinite ease-in-out; animation-delay: 0s; }
      .z2 { animation: float-z 6s infinite ease-in-out; animation-delay: 2s; }
      .z3 { animation: float-z 6s infinite ease-in-out; animation-delay: 4s; }

      @keyframes breathe-deep {
        0%, 80%, 100% { transform: scale(1, 1); }
        30%, 40%      { transform: scale(1.04, 1.18); }
      }
      @keyframes shadow-pulse {
        0%, 80%, 100% { transform: scaleX(1);   opacity: 0.4; }
        30%, 40%      { transform: scaleX(1.08); opacity: 0.5; }
      }
      @keyframes dim {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 0.3;  }
      }
      @keyframes float-z {
        0%   { transform: translate(2px, 6px)  scale(0.4); opacity: 0; }
        15%  { opacity: 0.9; }
        50%  { transform: translate(6px, 0px)  scale(0.8); }
        85%  { opacity: 0.6; }
        100% { transform: translate(4px, -8px) scale(1.1); opacity: 0; }
      }
    </style>

    <g id="pixel-z">
      <rect x="0" y="0" width="4" height="1"/>
      <rect x="2" y="1" width="1" height="1"/>
      <rect x="1" y="2" width="1" height="1"/>
      <rect x="0" y="3" width="4" height="1"/>
    </g>
  </defs>

  <rect class="shadow-pulse" x="-2" y="15" width="19" height="1" fill="#000000" opacity="0.5"/>

  <!-- Floating Zzz -->
  <g>
    <use href="#pixel-z" class="z-particle z1" x="6" y="-2" fill="#90A4AE"/>
    <use href="#pixel-z" class="z-particle z2" x="6" y="-2" fill="#B0BEC5"/>
    <use href="#pixel-z" class="z-particle z3" x="6" y="-2" fill="#CFD8DC"/>
  </g>

  <g class="breathe-deep">
    <!-- Legs tucked under (like sploot) -->
    <g fill="#A47148">
      <rect x="2"  y="11" width="2" height="2"/>
      <rect x="11" y="11" width="2" height="2"/>
      <rect x="4"  y="13" width="2" height="2"/>
      <rect x="9"  y="13" width="2" height="2"/>
    </g>

    <!-- Sleeping pose - flattened body -->
    <g fill="#A47148">
      <rect x="0" y="9" width="15" height="6"/>
    </g>

    <!-- Cracks on sleeping form -->
    <g fill="#6B4A2D">
      <rect x="0" y="12"  width="15" height="0.4"/>
      <rect x="5" y="9"   width="0.4" height="3"/>
      <rect x="10" y="12.4" width="0.4" height="2.6"/>
    </g>

    <!-- Highlights -->
    <g fill="#C49A6C">
      <rect x="1"  y="9" width="3" height="1"/>
      <rect x="7"  y="9" width="3" height="1"/>
    </g>

    <!-- Dim crystals (sleeping) -->
    <g class="crystal-dim" fill="#5DBF7E">
      <rect x="3"  y="10" width="1" height="1"/>
      <rect x="11" y="10" width="1" height="1"/>
      <rect x="6"  y="13" width="2" height="1"/>
    </g>

    <!-- Closed eyes (slits) -->
    <g fill="#1A1A1A">
      <rect x="3.5" y="11.5" width="2" height="0.4"/>
      <rect x="9.5" y="11.5" width="2" height="0.4"/>
    </g>
  </g>
</svg>
