<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-carry {
        transform-origin: 7.5px 15px;
        animation: carry-step 1.4s infinite ease-in-out;
      }
      .leg-c1 { transform-origin: 3px 11px;  animation: leg-walk 1.4s infinite ease-in-out; }
      .leg-c2 { transform-origin: 5px 12px;  animation: leg-walk 1.4s infinite ease-in-out; animation-delay: -0.7s; }
      .leg-c3 { transform-origin: 9px 12px;  animation: leg-walk 1.4s infinite ease-in-out; animation-delay: -0.7s; }
      .leg-c4 { transform-origin: 12px 11px; animation: leg-walk 1.4s infinite ease-in-out; }
      .crate-bob {
        transform-origin: 7.5px -2px;
        animation: crate-bob 1.4s infinite ease-in-out;
      }

      @keyframes carry-step {
        0%, 50%, 100% { transform: translateY(0); }
        25%, 75%      { transform: translateY(-0.5px); }
      }
      @keyframes leg-walk {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-0.8px); }
      }
      @keyframes crate-bob {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50%      { transform: translateY(-0.4px) rotate(1deg); }
      }
    </style>
  </defs>

  <rect x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <g class="body-carry">
    <g fill="#A47148">
      <rect class="leg-c1" x="2"  y="11" width="2" height="4"/>
      <rect class="leg-c2" x="5"  y="12" width="1" height="3"/>
      <rect class="leg-c3" x="9"  y="12" width="1" height="3"/>
      <rect class="leg-c4" x="11" y="11" width="2" height="4"/>
    </g>

    <!-- Both arms raised up to hold crate -->
    <g fill="#A47148">
      <rect x="2" y="2" width="3" height="4"/>
      <rect x="10" y="2" width="3" height="4"/>
    </g>

    <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

    <g fill="#6B4A2D">
      <rect x="2" y="8"  width="11" height="0.4"/>
      <rect x="6" y="5"  width="0.4" height="3"/>
      <rect x="9" y="8.4" width="0.4" height="3.6"/>
    </g>

    <g fill="#C49A6C">
      <rect x="3"  y="5" width="2" height="1"/>
      <rect x="8"  y="5" width="2" height="1"/>
    </g>

    <g fill="#5DBF7E">
      <rect x="4"  y="6"  width="1" height="1"/>
      <rect x="10" y="6"  width="1" height="1"/>
    </g>

    <!-- Strained eyes -->
    <g fill="#1A1A1A">
      <rect x="4"  y="8.5" width="1" height="1.5"/>
      <rect x="10" y="8.5" width="1" height="1.5"/>
    </g>

    <!-- Crate being carried (above head) -->
    <g class="crate-bob">
      <rect x="2"  y="-3" width="11" height="5" fill="#8B6342"/>
      <rect x="2"  y="-3" width="11" height="0.5" fill="#6B4A2D"/>
      <rect x="2"  y="1.5" width="11" height="0.5" fill="#6B4A2D"/>
      <rect x="7"  y="-3" width="1" height="5" fill="#6B4A2D"/>
      <rect x="3"  y="-2" width="2" height="0.5" fill="#5DBF7E"/>
      <rect x="9"  y="0"  width="2" height="0.5" fill="#5DBF7E"/>
    </g>
  </g>
</svg>
