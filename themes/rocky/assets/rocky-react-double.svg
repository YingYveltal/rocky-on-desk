<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-jump-react {
        transform-origin: 7.5px 15px;
        animation: jump-react 1.5s 1 ease-in-out;
      }
      .shadow-jump {
        transform-origin: 7.5px 15.5px;
        animation: shadow-j 1.5s 1 ease-in-out;
      }
      .arm-cheer-l {
        transform-origin: 4px 5px;
        animation: cheer-l 1.5s 1 ease-in-out;
      }
      .arm-cheer-r {
        transform-origin: 13px 8px;
        animation: cheer-r 1.5s 1 ease-in-out;
      }
      .impact-line { opacity: 0; animation: impact 1.5s 1 ease-out; }
      .il1 { animation-delay: 0s; }
      .il2 { animation-delay: 0.05s; }
      .il3 { animation-delay: 0.1s; }
      .il4 { animation-delay: 0.15s; }

      @keyframes jump-react {
        0%   { transform: translateY(0) scaleY(1); }
        15%  { transform: translateY(0) scaleY(0.78) scaleX(1.15); }
        50%  { transform: translateY(-12px) scaleY(1.08) scaleX(0.95); }
        85%  { transform: translateY(0) scaleY(0.85) scaleX(1.1); }
        100% { transform: translateY(0) scaleY(1); }
      }
      @keyframes shadow-j {
        0%   { transform: scale(1);   opacity: 0.5; }
        15%  { transform: scale(1.1); opacity: 0.55; }
        50%  { transform: scale(0.4); opacity: 0.15; }
        85%  { transform: scale(1.1); opacity: 0.55; }
        100% { transform: scale(1);   opacity: 0.5; }
      }
      @keyframes cheer-l {
        0%   { transform: rotate(0deg); }
        50%  { transform: rotate(-25deg) translateY(-1px); }
        100% { transform: rotate(0deg); }
      }
      @keyframes cheer-r {
        0%   { transform: rotate(0deg); }
        50%  { transform: rotate(60deg) translateY(-2px); }
        100% { transform: rotate(0deg); }
      }
      @keyframes impact {
        0%, 100% { opacity: 0; transform: scale(0.5); }
        20%      { opacity: 1; transform: scale(1.2); }
        50%      { opacity: 0; transform: scale(2); }
      }
    </style>
  </defs>

  <rect class="shadow-jump" x="-1" y="15" width="17" height="1" fill="#000000" opacity="0.5"/>

  <!-- Impact lines from launch -->
  <g class="impact-line il1" fill="#5DBF7E">
    <rect x="-2" y="14" width="2" height="0.6"/>
  </g>
  <g class="impact-line il2" fill="#5DBF7E">
    <rect x="15" y="14" width="2" height="0.6"/>
  </g>
  <g class="impact-line il3" fill="#5DBF7E">
    <rect x="-3" y="12" width="1" height="0.6"/>
  </g>
  <g class="impact-line il4" fill="#5DBF7E">
    <rect x="17" y="12" width="1" height="0.6"/>
  </g>

  <g class="body-jump-react">
    <g fill="#A47148">
      <rect x="2"  y="11" width="2" height="4"/>
      <rect x="5"  y="12" width="1" height="3"/>
      <rect x="9"  y="12" width="1" height="3"/>
      <rect x="11" y="11" width="2" height="4"/>
    </g>

    <g class="arm-cheer-l">
      <g fill="#A47148">
        <rect x="2" y="3"  width="2" height="3"/>
        <rect x="3" y="1"  width="2" height="2"/>
        <rect x="3" y="-1" width="2" height="2"/>
      </g>
    </g>

    <g class="arm-cheer-r">
      <g fill="#A47148">
        <rect x="13" y="7" width="2" height="3"/>
        <rect x="13" y="5" width="2" height="2"/>
      </g>
    </g>

    <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

    <g fill="#6B4A2D">
      <rect x="2" y="8"  width="11" height="0.4"/>
      <rect x="6" y="5"  width="0.4" height="3"/>
      <rect x="9" y="8.4" width="0.4" height="3.6"/>
    </g>

    <g fill="#C49A6C">
      <rect x="3"  y="5" width="2" height="1"/>
      <rect x="8"  y="5" width="2" height="1"/>
    </g>

    <g fill="#5DBF7E">
      <rect x="4"  y="6"  width="1" height="1"/>
      <rect x="10" y="6"  width="1" height="1"/>
      <rect x="6"  y="10" width="2" height="1"/>
    </g>

    <!-- Excited eyes (stars) -->
    <g fill="#1A1A1A">
      <rect x="3.5" y="8.3" width="2" height="1.4"/>
      <rect x="9.5" y="8.3" width="2" height="1.4"/>
    </g>
    <g fill="#5DBF7E">
      <rect x="4"  y="8.6" width="0.6" height="0.6"/>
      <rect x="10" y="8.6" width="0.6" height="0.6"/>
    </g>
  </g>
</svg>
