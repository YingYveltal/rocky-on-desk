<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .bounce {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: bounce 0.9s infinite ease-in-out;
      }
      .shadow-bounce {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-b 0.9s infinite ease-in-out;
      }
      .arm-l { transform-origin: 4px 5px; animation: wave-l 0.18s infinite alternate ease-in-out; }
      .arm-r { transform-origin: 13px 8px; animation: wave-r 0.18s infinite alternate ease-in-out; }
      .crystal-shine { animation: shine 1.4s infinite ease-in-out; }
      .spark-c { opacity: 0; animation: flash-c 1.4s infinite step-end; animation-delay: var(--delay, 0s); }
      .spark-o { opacity: 0; animation: flash-o 1.4s infinite step-end; animation-delay: var(--delay, 0s); }

      @keyframes bounce {
        0%, 15%, 100% { transform: translateY(0) scaleY(1); }
        20%           { transform: translateY(0) scaleY(0.85); }
        40%           { transform: translateY(-8px) scaleY(1.05); }
        50%           { transform: translateY(-10px) scaleY(1); }
        60%           { transform: translateY(-8px) scaleY(1.05); }
        80%           { transform: translateY(0) scaleY(0.85); }
        85%           { transform: translateY(0) scaleY(1); }
      }
      @keyframes shadow-b {
        0%, 15%, 100% { transform: scale(1); opacity: 0.5; }
        50%           { transform: scale(0.55); opacity: 0.18; }
      }
      @keyframes wave-l { 0% { transform: rotate(-15deg); } 100% { transform: rotate(20deg); } }
      @keyframes wave-r { 0% { transform: rotate(-30deg); } 100% { transform: rotate(40deg); } }
      @keyframes shine { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
      @keyframes flash-c {
        0%   { opacity: 0; }
        10%  { opacity: 1; }
        30%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes flash-o {
        0%   { opacity: 0; }
        20%  { opacity: 1; }
        40%  { opacity: 0; }
        100% { opacity: 0; }
      }
    </style>

    <g id="px-sparkle">
      <rect class="spark-c" x="-0.5" y="-0.5" width="1" height="1"/>
      <path class="spark-o" d="M -0.5,-1.5 h1 v1 h-1 z M -0.5,0.5 h1 v1 h-1 z M -1.5,-0.5 h1 v1 h-1 z M 0.5,-0.5 h1 v1 h-1 z"/>
    </g>
  </defs>

  <rect class="shadow-bounce" x="3" y="15" width="9" height="1" fill="#000000"/>

  <!-- Pixel sparkles -->
  <g>
    <use href="#px-sparkle" x="-2" y="-2" fill="#FFD700" style="--delay: 0s"/>
    <use href="#px-sparkle" x="16" y="-3" fill="#FFA000" style="--delay: 0.3s"/>
    <use href="#px-sparkle" x="18" y="10" fill="#FFF59D" style="--delay: 0.6s"/>
    <use href="#px-sparkle" x="-4" y="11" fill="#FFC107" style="--delay: 0.9s"/>
    <use href="#px-sparkle" x="7"  y="-9" fill="#FFF59D" style="--delay: 1.2s"/>
    <use href="#px-sparkle" x="-2" y="6"  fill="#FFD700" style="--delay: 0.5s"/>
  </g>

  <g class="bounce">
    <g fill="#A47148">
      <rect x="2"  y="11" width="2" height="4"/>
      <rect x="5"  y="12" width="1" height="3"/>
      <rect x="9"  y="12" width="1" height="3"/>
      <rect x="11" y="11" width="2" height="4"/>
    </g>

    <!-- Both arms waving up -->
    <g class="arm-l">
      <g fill="#A47148">
        <rect x="2" y="3"  width="2" height="3"/>
        <rect x="3" y="1"  width="2" height="2"/>
        <rect x="3" y="-1" width="2" height="2"/>
      </g>
    </g>
    <g class="arm-r">
      <g fill="#A47148">
        <rect x="11" y="3"  width="2" height="3"/>
        <rect x="11" y="1"  width="2" height="2"/>
        <rect x="11" y="-1" width="2" height="2"/>
      </g>
    </g>

    <rect x="2" y="5" width="11" height="7" fill="#A47148"/>

    <g fill="#6B4A2D">
      <rect x="2" y="8"  width="11" height="0.4"/>
      <rect x="6" y="5"  width="0.4" height="3"/>
      <rect x="9" y="8.4" width="0.4" height="3.6"/>
    </g>

    <g fill="#C49A6C">
      <rect x="3"  y="5" width="2" height="1"/>
      <rect x="8"  y="5" width="2" height="1"/>
    </g>

    <g class="crystal-shine" fill="#5DBF7E">
      <rect x="4"  y="6"  width="1" height="1"/>
      <rect x="10" y="6"  width="1" height="1"/>
      <rect x="6"  y="10" width="2" height="1"/>
      <rect x="3"  y="11" width="1" height="1"/>
    </g>

    <!-- Happy crescent eyes -->
    <g fill="#1A1A1A">
      <rect x="3.5" y="8.5" width="2" height="0.6"/>
      <rect x="3.5" y="8.1" width="0.5" height="0.4"/>
      <rect x="5"   y="8.1" width="0.5" height="0.4"/>
      <rect x="9.5" y="8.5" width="2" height="0.6"/>
      <rect x="9.5" y="8.1" width="0.5" height="0.4"/>
      <rect x="11"  y="8.1" width="0.5" height="0.4"/>
    </g>
  </g>
</svg>
